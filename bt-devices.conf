# Shared config for the smart-bt-kvm scripts.
# Install: cp bt-devices.conf ~/.config/bt-devices.conf
# (all scripts also honor BT_DEVICES_CONF to point elsewhere)
#
# Sourced as bash — keep it to variable assignments.

DEVICE_IDS=(                    # from: blueutil --paired
    "XX-XX-XX-XX-XX-XX"         # e.g. Magic Trackpad
    "YY-YY-YY-YY-YY-YY"         # e.g. Magic Keyboard
)
