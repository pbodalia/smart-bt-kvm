# Shared config for the smart-bt-kvm scripts.
# Install: cp bt-devices.conf ~/.config/bt-devices.conf
# (all scripts also honor BT_DEVICES_CONF to point elsewhere)
#
# Sourced as bash — keep it to variable assignments.

DEVICE_IDS=(                    # from: blueutil --paired
    "XX-XX-XX-XX-XX-XX"         # e.g. Magic Trackpad
    "YY-YY-YY-YY-YY-YY"         # e.g. Magic Keyboard
)

# Mute system output while ANY of these displays is attached; unmute once
# NONE of them are. Leave the list empty to disable.
#
# Get each ID from `~/bin/display-watcher --list` with that display plugged
# in. It is the EDID vendor:model:serial triple — stable across replug and
# reboot, unlike CGDirectDisplayID, which macOS reassigns every session.
# If a triple ends in :0 (the panel reports no serial) and you have two
# identical monitors, use the display's name instead, e.g. "LG HDR 4K".
MUTE_DISPLAY_IDS=(
    # "XXXX:YYYY:ZZZZZZZZ"     # e.g. the monitor at the office
)
